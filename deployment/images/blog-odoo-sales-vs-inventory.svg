<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
    <title id="title">Sales versus inventory control in Odoo</title>
    <desc id="desc">High contrast illustration showing a mismatch between sales and inventory that resolves into a controlled Odoo workflow.</desc>
    <defs>
        <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#051125" />
            <stop offset="50%" stop-color="#0e38b1" />
            <stop offset="100%" stop-color="#08101a" />
        </linearGradient>
        <linearGradient id="bad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff8a7a" />
            <stop offset="100%" stop-color="#c81d25" />
        </linearGradient>
        <linearGradient id="good" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#b7ff65" />
            <stop offset="100%" stop-color="#43b929" />
        </linearGradient>
        <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#02101e" flood-opacity="0.42" />
        </filter>
    </defs>
    <rect width="1600" height="900" fill="url(#bg2)" />
    <circle cx="1320" cy="160" r="170" fill="#2fd4ff" opacity="0.14" />
    <circle cx="260" cy="760" r="230" fill="#ffcf5a" opacity="0.14" />

    <g filter="url(#shadow2)">
        <rect x="120" y="170" width="540" height="520" rx="36" fill="#ffffff" />
        <rect x="120" y="170" width="540" height="118" rx="36" fill="#12224f" />
        <rect x="170" y="342" width="190" height="140" rx="22" fill="#fff2f0" />
        <rect x="388" y="342" width="222" height="140" rx="22" fill="#f3f7ff" />
        <rect x="170" y="516" width="440" height="126" rx="22" fill="#f8fbff" />

        <rect x="198" y="206" width="142" height="18" rx="9" fill="#dce5ff" />
        <rect x="198" y="238" width="98" height="14" rx="7" fill="#8ea9ff" />

        <path d="M224 430L312 378" stroke="#c81d25" stroke-width="18" stroke-linecap="round" />
        <path d="M312 430L224 378" stroke="#c81d25" stroke-width="18" stroke-linecap="round" />
        <rect x="430" y="374" width="132" height="22" rx="11" fill="#0e38b1" opacity="0.2" />
        <rect x="430" y="414" width="94" height="22" rx="11" fill="#0e38b1" opacity="0.16" />
        <rect x="210" y="550" width="348" height="18" rx="9" fill="#0e38b1" opacity="0.18" />
        <rect x="210" y="586" width="286" height="18" rx="9" fill="#0e38b1" opacity="0.14" />
    </g>

    <path d="M696 450H866" stroke="#ffcf5a" stroke-width="18" stroke-linecap="round" stroke-dasharray="18 26" />
    <polygon points="896,450 848,418 848,482" fill="#ffcf5a" />

    <g filter="url(#shadow2)">
        <rect x="940" y="140" width="520" height="560" rx="36" fill="#ffffff" />
        <rect x="940" y="140" width="520" height="118" rx="36" fill="#0e38b1" />
        <circle cx="1012" cy="198" r="18" fill="#a1e934" />
        <rect x="1050" y="182" width="146" height="16" rx="8" fill="#dce5ff" />
        <rect x="1050" y="212" width="108" height="12" rx="6" fill="#9bb5ff" />

        <rect x="986" y="314" width="150" height="308" rx="24" fill="#0a1530" />
        <rect x="1170" y="314" width="244" height="136" rx="24" fill="#eef3ff" />
        <rect x="1170" y="486" width="244" height="136" rx="24" fill="#eef3ff" />

        <rect x="1016" y="548" width="26" height="42" rx="10" fill="url(#good)" />
        <rect x="1054" y="514" width="26" height="76" rx="10" fill="url(#good)" />
        <rect x="1092" y="468" width="26" height="122" rx="10" fill="url(#good)" />

        <path d="M1204 400L1252 360L1296 390L1360 334" fill="none" stroke="#43b929" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="1204" cy="400" r="11" fill="#43b929" />
        <circle cx="1252" cy="360" r="11" fill="#43b929" />
        <circle cx="1296" cy="390" r="11" fill="#43b929" />
        <circle cx="1360" cy="334" r="11" fill="#43b929" />

        <rect x="1204" y="518" width="160" height="18" rx="9" fill="#0e38b1" opacity="0.2" />
        <rect x="1204" y="556" width="132" height="18" rx="9" fill="#0e38b1" opacity="0.16" />
        <rect x="1204" y="594" width="182" height="18" rx="9" fill="#0e38b1" opacity="0.12" />
    </g>

    <g filter="url(#shadow2)">
        <rect x="600" y="176" width="190" height="94" rx="22" fill="url(#bad)" />
        <text x="695" y="234" text-anchor="middle" fill="#ffffff" font-size="34" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Mismatch</text>
    </g>

    <text x="120" y="108" fill="#ffffff" font-size="44" font-family="Segoe UI, Arial, sans-serif" font-weight="700">Sales vs Inventory</text>
    <text x="120" y="158" fill="#cbdcff" font-size="24" font-family="Segoe UI, Arial, sans-serif">A clearer workflow turns conflicting numbers into reliable operations</text>
</svg>
