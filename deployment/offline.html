<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - GoCloud</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell,
          sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .offline-container {
        text-align: center;
        max-width: 500px;
        background: white;
        padding: 60px 40px;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .offline-icon {
        width: 120px;
        height: 120px;
        margin: 0 auto 30px;
        background: #f3f4f6;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 60px;
      }

      h1 {
        font-size: 32px;
        color: #1f2937;
        margin-bottom: 16px;
        font-weight: 700;
      }

      p {
        font-size: 18px;
        color: #6b7280;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .btn {
        display: inline-block;
        padding: 14px 32px;
        background: #2563eb;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 16px;
        transition: all 0.3s ease;
        cursor: pointer;
        border: none;
      }

      .btn:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
      }

      .connection-status {
        margin-top: 30px;
        padding: 16px;
        background: #fef3c7;
        border-radius: 8px;
        font-size: 14px;
        color: #92400e;
        display: none;
      }

      .connection-status.online {
        background: #d1fae5;
        color: #065f46;
        display: block;
      }

      .connection-status.offline {
        display: block;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .checking {
        animation: pulse 2s ease-in-out infinite;
      }

      @media (max-width: 640px) {
        .offline-container {
          padding: 40px 30px;
        }

        h1 {
          font-size: 24px;
        }

        p {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="offline-container">
      <div class="offline-icon">📡</div>
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Don't worry, you can still browse cached
        pages.
      </p>
      <button class="btn" id="offlineRetryBtn">Try Again</button>

      <div id="connection-status" class="connection-status offline">
        🔌 No internet connection detected
      </div>

      <script src="js/offline-page.js" defer></script>
    </div>
  </body>
</html>
