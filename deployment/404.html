<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | GoCloud</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="shortcut icon" href="/images/gocloud logo.webp" type="image/x-icon">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1f2937;
    }

    .container-404 {
      text-align: center;
      max-width: 600px;
      background: white;
      padding: 60px 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error-code {
      font-size: 120px;
      font-weight: 900;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.8;
      }
    }

    h1 {
      font-size: 32px;
      color: #1f2937;
      margin-bottom: 16px;
      font-weight: 700;
    }

    p {
      font-size: 18px;
      color: #6b7280;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .search-container {
      margin: 30px 0;
      display: flex;
      gap: 10px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .search-input {
      flex: 1;
      padding: 14px 20px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .search-input:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
      cursor: pointer;
      border: none;
      margin: 5px;
    }

    .btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3);
    }

    .btn-secondary {
      background: white;
      color: #2563eb;
      border: 2px solid #2563eb;
    }

    .btn-secondary:hover {
      background: #f3f4f6;
    }

    .links {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid #e5e7eb;
    }

    .links h2 {
      font-size: 18px;
      margin-bottom: 20px;
      color: #4b5563;
    }

    .quick-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      list-style: none;
    }

    .quick-links a {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
      padding: 10px;
      border-radius: 6px;
      background: #f9fafb;
    }

    .quick-links a:hover {
      color: #764ba2;
      background: #f3f4f6;
    }

    .illustration {
      margin-bottom: 30px;
      font-size: 80px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    @media (max-width: 640px) {
      .container-404 {
        padding: 40px 30px;
      }

      .error-code {
        font-size: 80px;
      }

      h1 {
        font-size: 24px;
      }

      p {
        font-size: 16px;
      }

      .search-container {
        flex-direction: column;
      }

      .quick-links {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container-404">
    <div class="illustration">🔍</div>
    <div class="error-code">404</div>
    <h1>Oops! Page Not Found</h1>
    <p>
      The page you're looking for doesn't exist or has been moved.
      Let's get you back on track!
    </p>

    <div class="search-container">
      <input
        type="text"
        class="search-input"
        placeholder="Search our site..."
        id="searchInput"
      >
      <button class="btn" id="searchBtn">Search</button>
    </div>

    <div style="margin-top: 20px;">
      <a href="/" class="btn">
        🏠 Go Home
      </a>
      <a href="#" id="goBackLink" class="btn btn-secondary">
        ← Go Back
      </a>
    </div>

    <div class="links">
      <h2>Quick Links</h2>
      <ul class="quick-links">
        <li><a href="/">🏠 Home</a></li>
        <li><a href="/about.html">ℹ️ About Us</a></li>
        <li><a href="/service.html">🛠️ Services</a></li>
        <li><a href="/portfolio.html">💼 Portfolio</a></li>
        <li><a href="/contact.html">📧 Contact</a></li>
        <li><a href="/odoo-dev.html">🔧 Odoo Development</a></li>
        <li><a href="/cloud-services.html">☁️ Cloud Services</a></li>
        <li><a href="/business.html">💼 Business Solutions</a></li>
      </ul>
    </div>
  </div>

  <script src="js/404-page.js" defer></script>
</body>
</html>
